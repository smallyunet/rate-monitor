<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="On-demand borrowing and flexible earn rates.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://rate-monitor-api.smallyu.workers.dev; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Rate Monitor</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css"><script src="./app.js" type="module"></script>
</head>
<body>
  <main>
    <header><h1>Rate Monitor</h1><nav><a href="https://github.com/smallyunet/rate-monitor" target="_blank" rel="noopener noreferrer">GitHub</a><button id="refresh" type="button">Refresh</button></nav></header>
    <div class="statusbar" aria-live="polite"><span id="status">Loading…</span><span id="updated"></span></div>
    <div class="table-wrap"><table role="table" aria-label="Current rates" aria-busy="true" id="rates"><thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">Platform</th><th role="columnheader" scope="col">Product</th><th role="columnheader" scope="col">Assets</th><th role="columnheader" scope="col">Tier APR</th><th role="columnheader" scope="col">Effective APR</th><th role="columnheader" scope="col">Updated</th></tr></thead><tbody role="rowgroup" id="rows"></tbody></table></div>
    <div id="config" class="notice" hidden>Binance API key required.</div>
  </main>
</body>
</html>
